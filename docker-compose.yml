services:
  postgres:
    image: postgres:18
    container_name: cinemacity-postgres
    environment:
      POSTGRES_DB: cinemacity
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cinemacity"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
